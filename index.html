<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMO AV1 — LDM FATEC</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --green: #1DB954;
  --green-dim: rgba(29,185,84,0.15);
  --green-dark: #158A3E;
  --bg: #121212;
  --surface: #181818;
  --surface2: #282828;
  --on-surface: #fff;
  --on-surface-dim: #B3B3B3;
  --outline: #535353;
  --error: #f44336;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: .18s cubic-bezier(.4,0,.2,1);
}
.light {
  --bg: #F0F0F0;
  --surface: #FFFFFF;
  --surface2: #E8E8E8;
  --on-surface: #121212;
  --on-surface-dim: #535353;
  --outline: #CCCCCC;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--on-surface);transition:background var(--transition),color var(--transition)}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;background:var(--surface);border-bottom:1px solid var(--outline);flex-shrink:0}
#topbar .logo{font-weight:800;color:var(--green);font-size:17px;letter-spacing:-.3px}
.theme-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--on-surface-dim)}
.toggle-track{width:42px;height:24px;border-radius:12px;background:var(--surface2);border:2px solid var(--outline);cursor:pointer;position:relative;transition:background var(--transition)}
.toggle-track.on{background:rgba(29,185,84,.4);border-color:var(--green)}
.toggle-thumb{width:16px;height:16px;border-radius:50%;background:var(--on-surface-dim);position:absolute;top:2px;left:2px;transition:transform var(--transition),background var(--transition)}
.toggle-track.on .toggle-thumb{transform:translateX(18px);background:var(--green)}

#content{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;padding:16px;display:none;animation:fadeIn .2s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#bottomnav{display:flex;background:var(--surface);border-top:1px solid var(--outline);flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;border:none;background:none;color:var(--on-surface-dim);font-family:inherit;font-size:11px;gap:4px;transition:color var(--transition);position:relative}
.nav-item svg{width:22px;height:22px;transition:color var(--transition)}
.nav-item.active{color:var(--green)}
.nav-item.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--green);border-radius:0 0 2px 2px}

/* ── Components ── */
.section-title{font-size:20px;font-weight:800;margin-bottom:12px}
.card{background:var(--surface2);border-radius:var(--radius);padding:16px;margin-bottom:8px}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-info{flex:1;min-width:0}
.card-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12px;color:var(--on-surface-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--on-surface-dim)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-error{background:rgba(244,67,54,.15);color:var(--error)}
.icon-box{width:44px;height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-circle{border-radius:50%}
.icon-green-bg{background:var(--green-dim)}
.icon-gray-bg{background:rgba(179,179,179,.15)}
.card-actions{display:flex;gap:2px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--transition)}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.edit svg{color:var(--green)}
.icon-btn.del svg{color:var(--error)}

input,textarea,select{font-family:inherit;background:transparent;color:var(--on-surface);border:1.5px solid var(--outline);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;width:100%;outline:none;transition:border-color var(--transition)}
input:focus,textarea:focus,select:focus{border-color:var(--green)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--on-surface-dim);margin-bottom:5px;font-weight:500}
textarea{resize:vertical;min-height:72px}
select option{background:var(--surface)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:24px;border:none;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:opacity var(--transition),transform var(--transition)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--green);color:#000}
.btn-outline{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn:hover{opacity:.9}
.btn+.btn{margin-top:10px}

.switch-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.switch{width:46px;height:26px;border-radius:13px;background:var(--outline);cursor:pointer;position:relative;transition:background var(--transition);flex-shrink:0;border:none}
.switch.on{background:rgba(29,185,84,.5)}
.switch-dot{width:18px;height:18px;border-radius:50%;background:var(--on-surface-dim);position:absolute;top:4px;left:4px;transition:transform var(--transition),background var(--transition)}
.switch.on .switch-dot{transform:translateX(20px);background:var(--green)}
.switch-label{font-size:14px}

.search-bar{position:relative;margin-bottom:16px}
.search-bar input{padding-left:44px;border-radius:28px}
.search-bar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--green)}
.search-bar .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:none;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--on-surface-dim)}
.search-bar .clear-btn svg{width:14px;height:14px}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px;color:var(--on-surface-dim);text-align:center;gap:12px}
.empty-state svg{width:64px;height:64px;opacity:.5}
.fab{position:fixed;bottom:80px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--green);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(29,185,84,.4);transition:transform var(--transition),box-shadow var(--transition);z-index:10}
.fab:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(29,185,84,.5)}
.fab svg{width:24px;height:24px;color:#000}

/* ── Forms ── */
.form-header{display:flex;align-items:center;gap:4px;margin-bottom:20px}
.back-btn{width:40px;height:40px;border-radius:50%;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--on-surface)}
.back-btn:hover{background:var(--surface2)}
.back-btn svg{width:22px;height:22px}
.musica-row{background:var(--surface2);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.musica-fields{flex:1;display:flex;gap:8px;flex-wrap:wrap}
.musica-fields .field{flex:1;min-width:120px;margin-bottom:0}
.remove-btn{width:32px;height:32px;border-radius:50%;border:none;background:none;cursor:pointer;color:var(--error);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:22px}
.remove-btn svg{width:18px;height:18px}
.add-musica-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--green);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:6px 0;margin-bottom:8px}
.duracao-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--on-surface-dim)}
.duracao-info span{color:var(--green);font-weight:700}
.artista-select{appearance:none;background:var(--bg)}

/* ── Home ── */
.home-section{margin-bottom:20px}
.home-section-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.home-section-header svg{width:20px;height:20px;color:var(--green)}
.home-section-header h3{font-size:17px;font-weight:700}
.cards-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cards-row::-webkit-scrollbar{display:none}
.home-card{background:var(--surface2);border-radius:var(--radius);padding:12px;flex-shrink:0;cursor:pointer;transition:transform var(--transition)}
.home-card:hover{transform:scale(1.02)}
.home-card-playlist{width:140px;height:140px;display:flex;flex-direction:column;justify-content:space-between}
.home-card-album{width:130px;height:150px;display:flex;flex-direction:column;justify-content:space-between}
.home-card-icon{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.home-card-icon.green-bg{background:var(--green-dim)}
.home-card-icon.gray-bg{background:rgba(179,179,179,.1)}
.home-card-icon svg{width:30px;height:30px}
.home-card-info .name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-card-info .sub{font-size:11px;color:var(--on-surface-dim);margin-top:2px}
.artista-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--surface2)}
.artista-row:last-child{border-bottom:none}
.artista-avatar{width:48px;height:48px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.artista-avatar svg{width:28px;height:28px;color:var(--on-surface-dim)}

/* ── Login ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:32px}
.login-logo{color:var(--green);margin-bottom:8px}
.login-logo svg{width:72px;height:72px}
.login-title{font-size:28px;font-weight:800;color:var(--green);text-align:center}
.login-sub{font-size:14px;color:var(--on-surface-dim);margin-bottom:32px;text-align:center}
.login-form{width:100%;max-width:400px}
.input-icon{position:relative}
.input-icon input{padding-left:44px}
.input-icon svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--on-surface-dim)}
.input-icon .eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:none;background:none;cursor:pointer;color:var(--on-surface-dim);display:flex;align-items:center;justify-content:center}
.input-icon .eye-btn svg{width:16px;height:16px}
.login-divider{text-align:center;color:var(--on-surface-dim);font-size:13px;margin:12px 0}

/* ── Detail ── */
.detail-header{display:flex;align-items:center;gap:4px;margin-bottom:12px}
.detail-title{font-size:20px;font-weight:800}
.detail-section{margin-top:16px}
.detail-section-title{font-size:13px;font-weight:600;color:var(--green);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.detail-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--surface2)}
.detail-row:last-child{border-bottom:none}

/* ── Playlist selection ── */
.sel-card{background:var(--surface2);border-radius:var(--radius-sm);padding:10px;margin-bottom:6px;cursor:pointer;transition:background var(--transition)}
.sel-card.selected{background:var(--green-dim)}
.sel-card-inner{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sel-card-left{display:flex;align-items:center;gap:8px}
.sel-card-left svg{width:20px;height:20px}
.check-icon{width:20px;height:20px;color:var(--green);flex-shrink:0}
.section-sub-title{font-size:13px;font-weight:700;color:var(--green);margin:12px 0 6px}

/* ── Date picker ── */
.date-btn{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;background:transparent;border:1.5px solid var(--outline);border-radius:var(--radius-sm);padding:0 14px;cursor:pointer;color:var(--on-surface);font-family:inherit;transition:border-color var(--transition)}
.date-btn:hover,.date-btn:focus{border-color:var(--green)}
.date-btn-left{text-align:left}
.date-btn-label{font-size:11px;color:var(--on-surface-dim)}
.date-btn-value{font-size:14px;font-weight:500}
.date-btn-icon svg{width:20px;height:20px;color:var(--green)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:340px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px}
.date-year-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.date-year-ctrl{display:flex;align-items:center;gap:4px}
.year-btn{width:36px;height:36px;border-radius:50%;border:none;background:none;cursor:pointer;color:var(--green);font-size:22px;display:flex;align-items:center;justify-content:center;font-weight:700}
.year-val{font-size:18px;font-weight:700;min-width:60px;text-align:center}
.months-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:12px}
.month-btn{height:30px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-family:inherit;background:var(--surface2);color:var(--on-surface);transition:background var(--transition)}
.month-btn.active{background:var(--green);color:#000;font-weight:700}
.day-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.day-display{width:52px;height:52px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#000}
.day-nav-btn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;background:none;transition:color var(--transition)}
.day-nav-btn.enabled{color:var(--green)}
.day-nav-btn.disabled{color:var(--outline);cursor:default}
</style>
</head>
<body>

<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <span class="logo">🎵 AV1 — LDM Demo</span>
    <div class="theme-toggle">
      <span id="theme-icon">☀️</span>
      <div class="toggle-track on" id="theme-toggle" onclick="toggleTheme()">
        <div class="toggle-thumb"></div>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content">
    <!-- LOGIN -->
    <div class="screen active" id="screen-login">
      <div id="login-screen">
        <div class="login-logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
        <div class="login-title">AV1 — LDM</div>
        <div class="login-sub" id="login-sub-text">Entre na sua conta</div>
        <div class="login-form" id="login-form-container">
          <div class="field">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>
              <input type="email" id="login-email" placeholder="Email">
            </div>
          </div>
          <div class="field">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="login-senha" placeholder="Senha">
              <button class="eye-btn" onclick="togglePwd('login-senha',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <button class="btn btn-primary" onclick="doLogin()">ENTRAR</button>
          <div class="login-divider">ou</div>
          <button class="btn btn-outline" onclick="showRegister()">CRIAR CONTA</button>
        </div>
        <!-- REGISTRO -->
        <div class="login-form" id="register-form-container" style="display:none">
          <div class="field"><div class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="reg-nome" placeholder="Nome"></div></div>
          <div class="field"><div class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg><input type="email" id="reg-email" placeholder="Email"></div></div>
          <div class="field"><div class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="reg-senha" placeholder="Senha"><button class="eye-btn" onclick="togglePwd('reg-senha',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <div class="field"><div class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="reg-confirma" placeholder="Confirmar Senha"><button class="eye-btn" onclick="togglePwd('reg-confirma',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <button class="btn btn-primary" onclick="doLogin()">REGISTRAR</button>
          <div class="login-divider"></div>
          <button class="btn btn-outline" onclick="showLogin()">JÁ TEM CONTA? ENTRAR</button>
        </div>
      </div>
    </div>

    <!-- HOME -->
    <div class="screen" id="screen-home"></div>
    <!-- AMANDA -->
    <div class="screen" id="screen-amanda"></div>
    <!-- BIANCA -->
    <div class="screen" id="screen-bianca"></div>
    <!-- DANILO -->
    <div class="screen" id="screen-danilo"></div>
    <!-- DANIEL -->
    <div class="screen" id="screen-daniel"></div>
  </div>

  <!-- BOTTOM NAV -->
  <div id="bottomnav" style="display:none">
    <button class="nav-item active" data-tab="home" onclick="navTo('home')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Início
    </button>
    <button class="nav-item" data-tab="amanda" onclick="navTo('amanda')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a9 9 0 0 0-9 9c0 3.07 1.54 5.78 3.9 7.43-.26.48-.4 1.02-.4 1.57 0 1.93 1.57 3.5 3.5 3.5s3.5-1.57 3.5-3.5c0-.55-.14-1.09-.4-1.57C15.46 15.78 17 13.07 17 10a9 9 0 0 0-9-9"/><ellipse cx="12" cy="10" rx="9" ry="9" fill="none"/></svg>
      Amanda
    </button>
    <button class="nav-item" data-tab="bianca" onclick="navTo('bianca')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      Bianca
    </button>
    <button class="nav-item" data-tab="danilo" onclick="navTo('danilo')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
      Danilo
    </button>
    <button class="nav-item" data-tab="daniel" onclick="navTo('daniel')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      Daniel
    </button>
  </div>
</div>

<!-- DATE PICKER MODAL -->
<div class="modal-backdrop" id="date-modal" style="display:none" onclick="closeDateModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Selecionar Data</div>
    <div class="date-year-row">
      <span style="font-weight:600">Ano</span>
      <div class="date-year-ctrl">
        <button class="year-btn" onclick="changeYear(-1)">‹</button>
        <span class="year-val" id="dp-year">2024</span>
        <button class="year-btn" onclick="changeYear(1)">›</button>
      </div>
    </div>
    <div style="font-weight:600;margin-bottom:8px;font-size:14px">Mês</div>
    <div class="months-grid" id="dp-months"></div>
    <div style="font-weight:600;margin-bottom:8px;font-size:14px">Dia</div>
    <div class="day-row">
      <button class="day-nav-btn" id="dp-prev-day" onclick="changeDay(-1)">‹</button>
      <div class="day-display" id="dp-day">01</div>
      <button class="day-nav-btn" id="dp-next-day" onclick="changeDay(1)">›</button>
    </div>
    <button class="btn btn-primary" onclick="confirmDate()">Confirmar</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// STATE — localStorage persistence
// ═══════════════════════════════════════════════════════════
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

let db = {
  artistas:  load('av1_artistas', []),
  albums:    load('av1_albums', []),
  musicas:   load('av1_musicas', []),
  playlists: load('av1_playlists', []),
  pl_musicas:load('av1_pl_musicas', []),
  pl_albums: load('av1_pl_albums', []),
  clipes:    load('av1_clipes', []),
  nextId:    load('av1_nextid', 1),
};
function persist() {
  save('av1_artistas', db.artistas); save('av1_albums', db.albums);
  save('av1_musicas', db.musicas); save('av1_playlists', db.playlists);
  save('av1_pl_musicas', db.pl_musicas); save('av1_pl_albums', db.pl_albums);
  save('av1_clipes', db.clipes); save('av1_nextid', db.nextId);
}
function nextId() { return db.nextId++; }

// ── Dark/light theme ──────────────────────────────────────
let dark = load('av1_dark', true);
function applyTheme() {
  document.documentElement.classList.toggle('light', !dark);
  document.getElementById('theme-icon').textContent = dark ? '🌙' : '☀️';
  const t = document.getElementById('theme-toggle');
  t.classList.toggle('on', dark);
}
function toggleTheme() { dark = !dark; save('av1_dark', dark); applyTheme(); }
applyTheme();

// ── Login ─────────────────────────────────────────────────
function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.style.opacity = show ? '1' : '.5';
}
function showRegister() {
  document.getElementById('login-form-container').style.display = 'none';
  document.getElementById('register-form-container').style.display = '';
  document.getElementById('login-sub-text').textContent = 'Preencha os dados para se registrar';
}
function showLogin() {
  document.getElementById('register-form-container').style.display = 'none';
  document.getElementById('login-form-container').style.display = '';
  document.getElementById('login-sub-text').textContent = 'Entre na sua conta';
}
function doLogin() {
  setScreen('home');
  document.getElementById('bottomnav').style.display = 'flex';
  renderHome();
}

// ── Navigation ────────────────────────────────────────────
let currentTab = 'home';
let formStack = []; // tracks sub-views

function setScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const s = document.getElementById('screen-' + id);
  if (s) s.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.tab === id);
  });
}

function navTo(tab) {
  currentTab = tab;
  formStack = [];
  setScreen(tab);
  if (tab === 'home') renderHome();
  else if (tab === 'amanda') renderArtistaLista();
  else if (tab === 'bianca') renderAlbumLista();
  else if (tab === 'danilo') renderPlaylistLista();
  else if (tab === 'daniel') renderClipeLista();
}

// ═══════════════════════════════════════════════════════════
// DATE PICKER
// ═══════════════════════════════════════════════════════════
let dpState = { ano:2024, mes:1, dia:1, cb:null };

function openDatePicker(ano, mes, dia, cb) {
  dpState = { ano, mes, dia, cb };
  renderDateModal();
  document.getElementById('date-modal').style.display = 'flex';
}
function closeDateModal(e) {
  if (e.target === document.getElementById('date-modal')) document.getElementById('date-modal').style.display = 'none';
}
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function renderDateModal() {
  document.getElementById('dp-year').textContent = dpState.ano;
  document.getElementById('dp-day').textContent = String(dpState.dia).padStart(2,'0');
  const max = daysInMonth(dpState.ano, dpState.mes);
  document.getElementById('dp-prev-day').className = 'day-nav-btn ' + (dpState.dia > 1 ? 'enabled':'disabled');
  document.getElementById('dp-next-day').className = 'day-nav-btn ' + (dpState.dia < max ? 'enabled':'disabled');
  const mg = document.getElementById('dp-months');
  mg.innerHTML = MESES.map((m,i) => `<button class="month-btn ${dpState.mes===i+1?'active':''}" onclick="selectMonth(${i+1})">${m}</button>`).join('');
}
function changeYear(d) { dpState.ano += d; dpState.dia = Math.min(dpState.dia, daysInMonth(dpState.ano, dpState.mes)); renderDateModal(); }
function selectMonth(m) { dpState.mes = m; dpState.dia = Math.min(dpState.dia, daysInMonth(dpState.ano, m)); renderDateModal(); }
function changeDay(d) {
  const max = daysInMonth(dpState.ano, dpState.mes);
  dpState.dia = Math.max(1, Math.min(max, dpState.dia + d));
  renderDateModal();
}
function confirmDate() {
  document.getElementById('date-modal').style.display = 'none';
  if (dpState.cb) dpState.cb(dpState.ano, dpState.mes, dpState.dia);
}
function fmtDate(y, m, d) { return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function parseDate(s) {
  const p = (s||'').split('-');
  return { ano: +p[0]||2024, mes: +p[1]||1, dia: +p[2]||1 };
}
function fmtDateDisplay(s) {
  if (!s) return '--';
  const p = s.split('-');
  return `${p[2]}/${p[1]}/${p[0]}`;
}

function ico(k, sz=18, col='currentColor') {
  return `<svg viewBox="0 0 24 24" fill="${col}" width="${sz}" height="${sz}">${ICONS[k]||''}</svg>`;
}

function calcDuration(musicas) {
  let total = 0;
  musicas.forEach(m => {
    const p = (m.duracao||'').split(':');
    if (p.length === 2) total += (+p[0]||0)*60 + (+p[1]||0);
  });
  if (!total) return '--:--';
  return `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════════════════════
let homeSearch = '';
let homeDetailPlaylist = null;

function renderHome() {
  const s = document.getElementById('screen-home');
  if (homeDetailPlaylist) { renderHomePlaylistDetail(s); return; }
  const q = homeSearch.toLowerCase();
  const artistas = q ? db.artistas.filter(a=>a.nome.toLowerCase().includes(q)||a.genero.toLowerCase().includes(q)) : db.artistas;
  const albums   = q ? db.albums.filter(a=>a.titulo.toLowerCase().includes(q)) : db.albums;
  const playlists= q ? db.playlists.filter(p=>p.nome.toLowerCase().includes(q)) : db.playlists;
  const clipes   = q ? db.clipes.filter(c=>c.titulo.toLowerCase().includes(q)||c.artista.toLowerCase().includes(q)) : db.clipes;
  const albumsCA = albums.map(a=>({...a, nomeArtista:(db.artistas.find(ar=>ar.id===a.artistaId)||{nome:''}).nome}));

  s.innerHTML = `
  <div class="search-bar">
    <input type="text" placeholder="Buscar artistas, álbuns, clipes…" value="${escHtml(homeSearch)}" oninput="homeSearch=this.value;renderHome()">
    ${ico('search',18,'var(--green)')}
    ${homeSearch?`<button class="clear-btn" onclick="homeSearch='';renderHome()">${ico('clear',14)}</button>`:''}
  </div>
  ${q ? renderHomeSearch(artistas,albumsCA,playlists,clipes) : renderHomeNormal(artistas,albumsCA,playlists,clipes)}`;
}

function renderHomeNormal(artistas, albums, playlists, clipes) {
  return `
  <div class="home-section">
    <div class="home-section-header">${ico('folder',20,'var(--green)')}<h3>Suas Playlists</h3></div>
    ${playlists.length ? `<div class="cards-row">${playlists.map(p=>`
      <div class="home-card home-card-playlist" onclick="homeOpenPlaylist(${p.id})">
        <div class="home-card-icon green-bg">${ico('folder',30,'var(--green)')}</div>
        <div class="home-card-info"><div class="name">${escHtml(p.nome)}</div><div class="sub">${p.totalItens} itens</div>
        <div class="sub">${ico('public',11,'var(--green)')} ${p.publica?'Pública':'Privada'}</div></div>
      </div>`).join('')}</div>` : `<div style="color:var(--on-surface-dim);font-size:13px;padding:4px 0 12px">Nenhuma playlist criada ainda</div>`}
  </div>
  <div class="home-section">
    <div class="home-section-header">${ico('album',20,'var(--green)')}<h3>Álbuns</h3></div>
    ${albums.length ? `<div class="cards-row">${albums.map(a=>`
      <div class="home-card home-card-album">
        <div class="home-card-icon gray-bg">${ico('album',30,'var(--on-surface-dim)')}</div>
        <div class="home-card-info"><div class="name">${escHtml(a.titulo)}</div><div class="sub">${escHtml(a.nomeArtista||'—')}</div><div class="sub">${a.lancamento||''}</div></div>
      </div>`).join('')}</div>` : `<div style="color:var(--on-surface-dim);font-size:13px;padding:4px 0 12px">Nenhum álbum cadastrado ainda</div>`}
  </div>
  <div class="home-section">
    <div class="home-section-header">${ico('person',20,'var(--green)')}<h3>Artistas</h3></div>
    ${artistas.length ? artistas.map(a=>`
      <div class="artista-row">
        <div class="artista-avatar">${ico('person',28)}</div>
        <div style="flex:1"><div style="font-weight:600;font-size:15px">${escHtml(a.nome)}</div><div style="font-size:12px;color:var(--on-surface-dim)">${escHtml(a.genero)}</div></div>
        ${a.ativo?`<span class="badge badge-green">Ativo</span>`:''}
      </div>`).join('') : `<div style="color:var(--on-surface-dim);font-size:13px;padding:4px 0 12px">Nenhum artista cadastrado ainda</div>`}
  </div>
  ${clipes.length?`<div class="home-section">
    <div class="home-section-header">${ico('video',20,'var(--green)')}<h3>Clipes</h3></div>
    <div class="cards-row">${clipes.map(c=>`
      <div class="home-card home-card-album">
        <div class="home-card-icon green-bg">${ico('video',26,'var(--green)')}</div>
        <div class="home-card-info"><div class="name">${escHtml(c.titulo)}</div><div class="sub">${escHtml(c.artista)}</div><div class="sub">${c.duracao||'--:--'}</div></div>
      </div>`).join('')}</div>
  </div>`:''}`;
}

function renderHomeSearch(artistas,albums,playlists,clipes) {
  if (!artistas.length && !albums.length && !playlists.length && !clipes.length)
    return `<div class="empty-state">${ico('search',48)}<span>Nenhum resultado para "${escHtml(homeSearch)}"</span></div>`;
  let html = '';
  if (artistas.length) html += `<div class="home-section"><div class="home-section-header">${ico('person',20,'var(--green)')}<h3>Artistas</h3></div>${artistas.map(a=>`<div class="artista-row"><div class="artista-avatar">${ico('person',28)}</div><div style="flex:1"><div style="font-weight:600">${escHtml(a.nome)}</div><div style="font-size:12px;color:var(--on-surface-dim)">${escHtml(a.genero)}</div></div>${a.ativo?`<span class="badge badge-green">Ativo</span>`:''}</div>`).join('')}</div>`;
  if (albums.length) html += `<div class="home-section"><div class="home-section-header">${ico('album',20,'var(--green)')}<h3>Álbuns</h3></div><div class="cards-row">${albums.map(a=>`<div class="home-card home-card-album"><div class="home-card-icon gray-bg">${ico('album',30,'var(--on-surface-dim)')}</div><div class="home-card-info"><div class="name">${escHtml(a.titulo)}</div><div class="sub">${escHtml(a.nomeArtista||'—')}</div></div></div>`).join('')}</div></div>`;
  if (clipes.length) html += `<div class="home-section"><div class="home-section-header">${ico('video',20,'var(--green)')}<h3>Clipes</h3></div><div class="cards-row">${clipes.map(c=>`<div class="home-card home-card-album"><div class="home-card-icon green-bg">${ico('video',26,'var(--green)')}</div><div class="home-card-info"><div class="name">${escHtml(c.titulo)}</div><div class="sub">${escHtml(c.artista)}</div></div></div>`).join('')}</div></div>`;
  return html;
}

function homeOpenPlaylist(pid) {
  homeDetailPlaylist = db.playlists.find(p=>p.id===pid);
  renderHome();
}
function renderHomePlaylistDetail(s) {
  const p = homeDetailPlaylist;
  const musicas = db.pl_musicas.filter(pm=>pm.playlistId===p.id).map(pm=>{
    const m = db.musicas.find(x=>x.id===pm.musicaId);
    if (!m) return null;
    const alb = db.albums.find(a=>a.id===m.albumId)||{titulo:'',artistaId:0};
    const art = db.artistas.find(a=>a.id===alb.artistaId)||{nome:''};
    return {...m,tituloAlbum:alb.titulo,nomeArtista:art.nome};
  }).filter(Boolean);
  const albums = db.pl_albums.filter(pa=>pa.playlistId===p.id).map(pa=>{
    const a = db.albums.find(x=>x.id===pa.albumId);
    if (!a) return null;
    const art = db.artistas.find(x=>x.id===a.artistaId)||{nome:''};
    return {...a,nomeArtista:art.nome};
  }).filter(Boolean);

  s.innerHTML = `
  <div class="detail-header">
    <button class="back-btn" onclick="homeDetailPlaylist=null;renderHome()">${ico('back',22)}</button>
    <span class="detail-title">${escHtml(p.nome)}</span>
  </div>
  ${p.descricao?`<div style="font-size:13px;color:var(--on-surface-dim);margin-bottom:12px">${escHtml(p.descricao)}</div>`:''}
  ${albums.length?`<div class="detail-section"><div class="detail-section-title">Álbuns</div>${albums.map(a=>`
    <div class="detail-row">
      <div class="icon-box icon-gray-bg">${ico('album',22,'var(--green)')}</div>
      <div style="flex:1;margin-left:12px"><div style="font-weight:600">${escHtml(a.titulo)}</div><div style="font-size:12px;color:var(--on-surface-dim)">${escHtml(a.nomeArtista)}</div></div>
      <div style="font-size:12px;color:var(--on-surface-dim)">${a.duracao||''}</div>
    </div>`).join('')}</div>`:''}
  ${musicas.length?`<div class="detail-section"><div class="detail-section-title">Músicas</div>${musicas.map(m=>`
    <div class="detail-row">
      <div class="icon-box icon-circle icon-gray-bg">${ico('note',22,'var(--green)')}</div>
      <div style="flex:1;margin-left:12px"><div style="font-weight:600">${escHtml(m.titulo)}</div><div style="font-size:12px;color:var(--on-surface-dim)">${escHtml(m.tituloAlbum)} • ${escHtml(m.nomeArtista)}</div></div>

function saveArtista() {

function newAlbum() { albumForm={id:0,titulo:'',artistaId:0,ano:2024,mes:1,dia:1,disponivel:true,musicas:[{id:0,titulo:'',duracao:''}]}; renderAlbumForm(); }

  const d = parseDate(a.lancamento);

  albumForm={id:a.id,titulo:a.titulo,artistaId:a.artistaId,ano:d.ano,mes:d.mes,dia:d.dia,disponivel:a.disponivel,musicas:ms.length?ms:[{id:0,titulo:'',duracao:''}]};

}
function delAlbum(id) {
  db.albums=db.albums.filter(a=>a.id!==id);
  db.musicas=db.musicas.filter(m=>m.albumId!==id);
  persist(); renderAlbumLista();
}
function renderAlbumForm() {
  const f = albumForm;
  const dur = calcDuration(f.musicas);
  const s = document.getElementById('screen-bianca');
  s.innerHTML = `
  <div class="form-header">
    <button class="back-btn" onclick="renderAlbumLista()">${ico('back',22)}</button>

      <div class="date-btn-left"><div class="date-btn-label">Data de Lançamento</div><div class="date-btn-value">${String(f.dia).padStart(2,'0')}/${String(f.mes).padStart(2,'0')}/${f.ano}</div></div>

    </button>
  </div>

    <button class="add-musica-btn" onclick="albumForm.musicas.push({id:0,titulo:'',duracao:''});renderAlbumForm()">${ico('add',18,'var(--green)')} Adicionar</button>
  </div>
  ${f.musicas.map((m,i)=>`
  <div class="musica-row">
    ${ico('note',20,'var(--green)')}
    <div class="musica-fields">
      <div class="field"><label>Título</label><input value="${escHtml(m.titulo)}" oninput="albumForm.musicas[${i}].titulo=this.value;document.querySelector('.duracao-info span').textContent=calcDuration(albumForm.musicas)"></div>
      <div class="field"><label>Duração (m:ss)</label><input value="${escHtml(m.duracao)}" placeholder="3:45" oninput="albumForm.musicas[${i}].duracao=this.value;document.querySelector('.duracao-info span').textContent=calcDuration(albumForm.musicas)"></div>
    </div>
    <button class="remove-btn" onclick="if(albumForm.musicas.length>1){albumForm.musicas.splice(${i},1);renderAlbumForm()}">${ico('remove',18,'var(--error)')}</button>
  </div>`).join('')}
  <button class="btn btn-primary" style="margin-top:12px" onclick="saveAlbum()">Gravar</button>
  <button class="btn btn-outline" onclick="albumForm={id:0,titulo:'',artistaId:0,ano:2024,mes:1,dia:1,disponivel:true,musicas:[{id:0,titulo:'',duracao:''}]};renderAlbumForm()">Limpar Campos</button>`;
}
function saveAlbum() {
  const f = albumForm;
  if (!f.titulo.trim()) return;
  const dur = calcDuration(f.musicas);
  const obj = {id:f.id||nextId(),titulo:f.titulo.trim(),artistaId:f.artistaId,lancamento:fmtDate(f.ano,f.mes,f.dia),disponivel:f.disponivel,duracao:dur};
  if (f.id) { db.albums=db.albums.map(a=>a.id===f.id?obj:a); db.musicas=db.musicas.filter(m=>m.albumId!==f.id); }
  else db.albums.push(obj);
  f.musicas.filter(m=>m.titulo.trim()).forEach(m=>{db.musicas.push({id:m.id||nextId(),titulo:m.titulo.trim(),duracao:m.duracao.trim(),albumId:obj.id});});
  persist(); renderAlbumLista();
}

let playlistForm = null;

function renderPlaylistDetail() {
  const p = playlistDetail;

    const m = db.musicas.find(x=>x.id===pm.musicaId); if(!m) return null;
    const alb=db.albums.find(a=>a.id===m.albumId)||{titulo:'',artistaId:0};
    const art=db.artistas.find(a=>a.id===alb.artistaId)||{nome:''};

  }).filter(Boolean);

    const a=db.albums.find(x=>x.id===pa.albumId); if(!a) return null;
    const art=db.artistas.find(x=>x.id===a.artistaId)||{nome:''};
    return {...a,nomeArtista:art.nome};
  }).filter(Boolean);

  s.innerHTML = `

}

function newPlaylist() { playlistForm={id:0,nome:'',descricao:'',publica:true,ano:2024,mes:1,dia:1,busca:'',selMusicas:new Set,selAlbums:new Set}; renderPlaylistForm(); }
function editPlaylist(id) {
  const p=db.playlists.find(x=>x.id===id);
  const d=parseDate(p.criadaEm);
  const selM=new Set(db.pl_musicas.filter(pm=>pm.playlistId===id).map(pm=>pm.musicaId));
  const selA=new Set(db.pl_albums.filter(pa=>pa.playlistId===id).map(pa=>pa.albumId));
  playlistForm={id:p.id,nome:p.nome,descricao:p.descricao,publica:p.publica,ano:d.ano,mes:d.mes,dia:d.dia,busca:'',selMusicas:selM,selAlbums:selA};
  renderPlaylistForm();
}
function delPlaylist(id) {
  db.playlists=db.playlists.filter(p=>p.id!==id);
  db.pl_musicas=db.pl_musicas.filter(pm=>pm.playlistId!==id);
  db.pl_albums=db.pl_albums.filter(pa=>pa.playlistId!==id);
  persist(); renderPlaylistLista();
}
function renderPlaylistForm() {
  const f = playlistForm;
  const q = f.busca.toLowerCase();
  const allAlbums = albumsComArtista();
  const filtAlbums = q ? allAlbums.filter(a=>a.titulo.toLowerCase().includes(q)||a.nomeArtista.toLowerCase().includes(q)) : allAlbums;
  const filtMusicas = db.musicas.filter(m=>{
    if (!q) return true;
    const alb=db.albums.find(a=>a.id===m.albumId)||{titulo:''};
    return m.titulo.toLowerCase().includes(q)||alb.titulo.toLowerCase().includes(q);
  }).map(m=>{const alb=db.albums.find(a=>a.id===m.albumId)||{titulo:'',artistaId:0};const art=db.artistas.find(a=>a.id===alb.artistaId)||{nome:''};return {...m,tituloAlbum:alb.titulo,nomeArtista:art.nome};});

  const s = document.getElementById('screen-danilo');
  s.innerHTML = `
  <div class="form-header">
    <button class="back-btn" onclick="renderPlaylistLista()">${ico('back',22)}</button>
    <div class="section-title" style="margin:0">${f.id?'Editar Playlist':'Nova Playlist'}</div>
  </div>
  <div class="field"><label>Nome da Playlist</label><input value="${escHtml(f.nome)}" oninput="playlistForm.nome=this.value"></div>
  <div class="field"><label>Descrição</label><textarea oninput="playlistForm.descricao=this.value">${escHtml(f.descricao)}</textarea></div>
  <div class="field"><label>Data de Criação</label>
    <button class="date-btn" onclick="openDatePicker(${f.ano},${f.mes},${f.dia},(y,m,d)=>{playlistForm.ano=y;playlistForm.mes=m;playlistForm.dia=d;renderPlaylistForm()})">
      <div class="date-btn-left"><div class="date-btn-label">Data de Criação</div><div class="date-btn-value">${String(f.dia).padStart(2,'0')}/${String(f.mes).padStart(2,'0')}/${f.ano}</div></div>
      <div class="date-btn-icon">${ico('calendar',20,'var(--green)')}</div>
    </button>
  </div>
  <div class="switch-row">
    <button class="switch ${f.publica?'on':''}" onclick="playlistForm.publica=!playlistForm.publica;renderPlaylistForm()"><div class="switch-dot"></div></button>
    <span class="switch-label">${f.publica?'Pública':'Privada'}</span>
  </div>
  <div class="search-bar">
    <input type="text" placeholder="Pesquisar álbum ou música" value="${escHtml(f.busca)}" oninput="playlistForm.busca=this.value;renderPlaylistForm()">
    ${ico('search',18,'var(--green)')}
    ${f.busca?`<button class="clear-btn" onclick="playlistForm.busca='';renderPlaylistForm()">${ico('clear',14)}</button>`:''}
  </div>
  ${filtAlbums.length?`<div class="section-sub-title">Álbuns disponíveis</div>${filtAlbums.map(a=>`
    <div class="sel-card ${f.selAlbums.has(a.id)?'selected':''}" onclick="playlistForm.selAlbums.has(${a.id})?playlistForm.selAlbums.delete(${a.id}):playlistForm.selAlbums.add(${a.id});renderPlaylistForm()">
      <div class="sel-card-inner">
        <div class="sel-card-left">${ico('album',20,f.selAlbums.has(a.id)?'var(--green)':'var(--on-surface-dim)')}<div><div style="font-size:14px;font-weight:500">${escHtml(a.titulo)}</div><div style="font-size:12px;color:var(--on-surface-dim)">${escHtml(a.nomeArtista)}</div></div></div>
        ${f.selAlbums.has(a.id)?`<div class="check-icon">${ico('check_circle',20,'var(--green)')}</div>`:''}
      </div>
    </div>`).join('')}`:''}
  ${filtMusicas.length?`<div class="section-sub-title">Músicas disponíveis</div>${filtMusicas.map(m=>`
    <div class="sel-card ${f.selMusicas.has(m.id)?'selected':''}" onclick="playlistForm.selMusicas.has(${m.id})?playlistForm.selMusicas.delete(${m.id}):playlistForm.selMusicas.add(${m.id});renderPlaylistForm()">
      <div class="sel-card-inner">
        <div class="sel-card-left">${ico('note',20,f.selMusicas.has(m.id)?'var(--green)':'var(--on-surface-dim)')}<div><div style="font-size:14px;font-weight:500">${escHtml(m.titulo)}</div><div style="font-size:12px;color:var(--on-surface-dim)">${escHtml(m.tituloAlbum)} • ${escHtml(m.nomeArtista)}</div></div></div>
        <div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;color:var(--on-surface-dim)">${m.duracao||''}</span>${f.selMusicas.has(m.id)?`<div class="check-icon">${ico('check_circle',20,'var(--green)')}</div>`:''}</div>
      </div>
    </div>`).join('')}`:''}
  ${!filtAlbums.length&&!filtMusicas.length?`<p style="color:var(--on-surface-dim);font-size:13px">Nenhum álbum ou música cadastrado ainda</p>`:''}

  <button class="btn btn-outline" onclick="playlistForm={id:0,nome:'',descricao:'',publica:true,ano:2024,mes:1,dia:1,busca:'',selMusicas:new Set,selAlbums:new Set};renderPlaylistForm()">Limpar Campos</button>
  <div style="height:24px"></div>`;
}
function savePlaylist() {
  const f=playlistForm;
  if(!f.nome.trim()) return;
  const total=f.selMusicas.size+f.selAlbums.size;
  const obj={id:f.id||nextId(),nome:f.nome.trim(),descricao:f.descricao.trim(),publica:f.publica,criadaEm:fmtDate(f.ano,f.mes,f.dia),totalItens:total};
  if(f.id){
    db.playlists=db.playlists.map(p=>p.id===f.id?obj:p);
    db.pl_musicas=db.pl_musicas.filter(pm=>pm.playlistId!==f.id);
    db.pl_albums=db.pl_albums.filter(pa=>pa.playlistId!==f.id);
  } else db.playlists.push(obj);
  f.selMusicas.forEach(mid=>db.pl_musicas.push({playlistId:obj.id,musicaId:mid}));
  f.selAlbums.forEach(aid=>db.pl_albums.push({playlistId:obj.id,albumId:aid}));
  persist(); renderPlaylistLista();
}

// DANIEL — Clipes
// ═══════════════════════════════════════════════════════════
let clipeForm=null, clipeSearch='';

function renderClipeLista() {
  clipeForm=null;
  const s=document.getElementById('screen-daniel');
  const list=clipeSearch ? db.clipes.filter(c=>c.titulo.toLowerCase().includes(clipeSearch.toLowerCase())||c.artista.toLowerCase().includes(clipeSearch.toLowerCase())) : db.clipes;
  s.innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <div class="section-title">Clipes</div>
  </div>
  <div class="search-bar">
    <input type="text" placeholder="Buscar clipe ou artista…" value="${escHtml(clipeSearch)}" oninput="clipeSearch=this.value;renderClipeLista()">
    ${ico('search',18,'var(--green)')}
    ${clipeSearch?`<button class="clear-btn" onclick="clipeSearch='';renderClipeLista()">${ico('clear',14)}</button>`:''}
  </div>
  ${list.length?list.map(c=>`
  <div class="card"><div class="card-row">
    <div class="icon-box icon-green-bg" style="width:44px;height:44px;border-radius:8px">${ico('video',24,'var(--green)')}</div>
    <div class="card-info" style="margin-left:12px">
      <div class="card-title">${escHtml(c.titulo)}</div>
      <div class="card-sub">${escHtml(c.artista)}</div>
      <div class="card-meta">${ico('timer',12,'var(--on-surface-dim)')} ${c.duracao||'--:--'} &nbsp; • ${c.dataLancamento||'--'}
        &nbsp; ${c.disponivel?ico('cloud_done',14,'var(--green)'):ico('cloud_off',14,'var(--error)')}
      </div>
    </div>
    <div class="card-actions">
      <button class="icon-btn edit" onclick="editClipe(${c.id})">${ico('edit',18,'var(--green)')}</button>
      <button class="icon-btn del" onclick="delClipe(${c.id})">${ico('del',18,'var(--error)')}</button>
    </div>
  </div></div>`).join(''):`<div class="empty-state">${ico('video',64)}<span>${clipeSearch?`Nenhum resultado para "${escHtml(clipeSearch)}"`:' Nenhum clipe cadastrado'}</span></div>`}
  <button class="fab" onclick="newClipe()">${ico('add',24,'#000')}</button>`;
}
function newClipe(){clipeForm={id:0,titulo:'',artista:'',duracao:'',ano:2024,mes:1,dia:1,disponivel:true};renderClipeForm();}
function editClipe(id){const c=db.clipes.find(x=>x.id===id);const d=parseDate(c.dataLancamento);clipeForm={id:c.id,titulo:c.titulo,artista:c.artista,duracao:c.duracao,ano:d.ano,mes:d.mes,dia:d.dia,disponivel:c.disponivel};renderClipeForm();}
function delClipe(id){db.clipes=db.clipes.filter(c=>c.id!==id);persist();renderClipeLista();}
function renderClipeForm(){
  const f=clipeForm;
  const s=document.getElementById('screen-daniel');
  s.innerHTML=`
  <div class="form-header">
    <button class="back-btn" onclick="renderClipeLista()">${ico('back',22)}</button>
    <div class="section-title" style="margin:0">${f.id?'Editar Clipe':'Novo Clipe'}</div>
  </div>
  <div class="field"><label>Título do Clipe</label><input value="${escHtml(f.titulo)}" oninput="clipeForm.titulo=this.value"></div>
  <div class="field"><label>Artista</label><input value="${escHtml(f.artista)}" oninput="clipeForm.artista=this.value"></div>
  <div class="field"><label>Duração (mm:ss)</label><input value="${escHtml(f.duracao)}" placeholder="3:45" oninput="clipeForm.duracao=this.value"></div>
  <div class="field"><label>Data de Lançamento</label>
    <button class="date-btn" onclick="openDatePicker(${f.ano},${f.mes},${f.dia},(y,m,d)=>{clipeForm.ano=y;clipeForm.mes=m;clipeForm.dia=d;renderClipeForm()})">
      <div class="date-btn-left"><div class="date-btn-label">Data de Lançamento</div><div class="date-btn-value">${String(f.dia).padStart(2,'0')}/${String(f.mes).padStart(2,'0')}/${f.ano}</div></div>
      <div class="date-btn-icon">${ico('calendar',20,'var(--green)')}</div>
    </button>
  </div>
  <div class="switch-row">
    <button class="switch ${f.disponivel?'on':''}" onclick="clipeForm.disponivel=!clipeForm.disponivel;renderClipeForm()"><div class="switch-dot"></div></button>
    <span class="switch-label">${f.disponivel?'Disponível':'Indisponível'}</span>
  </div>
  <button class="btn btn-primary" style="margin-top:4px" onclick="saveClipe()">Gravar</button>
  <button class="btn btn-outline" onclick="clipeForm={id:0,titulo:'',artista:'',duracao:'',ano:2024,mes:1,dia:1,disponivel:true};renderClipeForm()">Limpar Campos</button>`;
}
function saveClipe(){
  const f=clipeForm;if(!f.titulo.trim())return;
  const obj={id:f.id||nextId(),titulo:f.titulo.trim(),artista:f.artista.trim(),duracao:f.duracao.trim(),dataLancamento:fmtDate(f.ano,f.mes,f.dia),disponivel:f.disponivel};
  if(f.id)db.clipes=db.clipes.map(c=>c.id===f.id?obj:c);else db.clipes.push(obj);
  persist();renderClipeLista();
}

// ── util ──────────────────────────────────────────────────
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
